version: "3.9"

services:
  mysql:
    image: mysql
    container_name: mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: foxxist123456
      MYSQL_USER: foxxist
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    restart: always
    networks:
      - foxxist-club-prod

  firefox-center:
    image: foxxist/firefox-center
    container_name: firefox-center
    environment:
      - SERVER_PORT=8147
        - DB_USERNAME=root
        - DB_PASSWORD=123456
        - DB_URL=jdbc:mysql://mysql-prod:3306/firefox-center?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
        - OSS_ENDPOINT=oss-cn-hangzhou.aliyuncs.com
        - OSS_ACCESS_KEY_ID=LTAI...
        - OSS_ACCESS_KEY_SECRET=gRnP...
        - OSS_BUCKET_NAME=foxxist-firefox
        - WX_APP_ID=wx123
        - WX_SECRET=abc
        - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - foxxist-club-prod

  nginx:
    image: nginx:latest
    container_name: nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - foxxist-club-prod
    restart: always

networks:
  foxxist-club-prod:
    external: true
