version: "3.9"

services:
  mysql:
    image: mysql
    container_name: mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: foxxist123456
      MYSQL_USER: foxxist
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    restart: always
    networks:
      - foxxist-club-prod

  firefox-center:
    image: foxxist/firefox-center
    container_name: firefox-center
    environment:
      - WX_APP_ID=123
      - WX_SECRET=abc
      - SERVER_PORT=8147
      - OSS_ACCESS_KEY_SECRET=qwe
      - OSS_ENDPOINT=s
      - OSS_ACCESS_KEY_ID=124
      - OSS_BUCKET_NAME=set
      - JAVA_OPT=-Xms256m -Xmx512m
    networks:
      - foxxist-club-prod

  nginx:
    image: nginx:latest
    container_name: nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - foxxist-club-prod
    restart: always

networks:
  foxxist-club-prod:
    external: true
